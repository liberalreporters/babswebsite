 \
            --exclude='admin/config.yml' \
            --exclude='CLOUDFLARE-WORKER-SETUP.md' \
            --exclude='wrangler.jsonc' \
            --exclude='worker.js' \
            --exclude='.dev.vars.example' \
            /tmp/babs-source/ ./

      - name: Validate mirrored website before committing
        run: |
          python tests/check_site.py

      - name: Commit mirrored source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source already up to date."
            exit 0
          fi
          git commit -m "chore: mirror authoritative BABS website source"
          git push origin HEAD:cloudflare-prep
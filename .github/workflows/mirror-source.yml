name: Source mirror (paused for staging safety)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain current publishing boundary
        run: |
          echo "Automatic source mirroring is paused while the CMS-backed staging site is being reviewed."
          echo "No files are copied to production or to another branch by this workflow."
          echo "Use the dedicated site validation workflow for staging checks."
